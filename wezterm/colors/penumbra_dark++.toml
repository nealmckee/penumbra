# Penumbra v2 -- WezTerm Color Scheme
# Theme: penumbra_dark++
# Mode: dark, Tier: contrast_plus_plus

[metadata]
name = "Penumbra Dark++"
author = "Neal McKee"

[colors]
foreground = "#a9a9a9"
background = "#101317"
cursor_bg = "#eee8dd"
cursor_border = "#eee8dd"
cursor_fg = "#101317"
selection_bg = "#1b1e23"
selection_fg = "#a9a9a9"

ansi = [
  "#07080b",
  "#e27092",
  "#8eb02a",
  "#da8f3e",
  "#009be2",
  "#a088d3",
  "#00aa98",
  "#eee8dd",
]

brights = [
  "#575b62",
  "#e27092",
  "#8eb02a",
  "#da8f3e",
  "#009be2",
  "#a088d3",
  "#00aa98",
  "#fff6e9",
]

[colors.tab_bar]
background = "#1b1e23"

[colors.tab_bar.active_tab]
bg_color = "#101317"
fg_color = "#c2c0bd"

[colors.tab_bar.inactive_tab]
bg_color = "#1b1e23"
fg_color = "#575b62"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#101317"
fg_color = "#a9a9a9"

[colors.tab_bar.new_tab]
bg_color = "#1b1e23"
fg_color = "#575b62"

[colors.tab_bar.new_tab_hover]
bg_color = "#101317"
fg_color = "#c2c0bd"
