# Penumbra v2 -- WezTerm Color Scheme
# Theme: penumbra_dark_semantic6
# Mode: dark, Tier: balanced

[metadata]
name = "Penumbra Dark (Semantic 6)"
author = "Neal McKee"

[colors]
foreground = "#8b8b8b"
background = "#2c2e31"
cursor_bg = "#efe8dd"
cursor_border = "#efe8dd"
cursor_fg = "#2c2e31"
selection_bg = "#383a3d"
selection_fg = "#8b8b8b"

ansi = [
  "#202225",
  "#ba616a",
  "#4f9158",
  "#948a1d",
  "#0081b4",
  "#9c67a1",
  "#008986",
  "#efe8dd",
]

brights = [
  "#5e6063",
  "#ba616a",
  "#4f9158",
  "#948a1d",
  "#0081b4",
  "#9c67a1",
  "#008986",
  "#fff6e9",
]

[colors.tab_bar]
background = "#383a3d"

[colors.tab_bar.active_tab]
bg_color = "#2c2e31"
fg_color = "#b4b1ad"

[colors.tab_bar.inactive_tab]
bg_color = "#383a3d"
fg_color = "#5e6063"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#2c2e31"
fg_color = "#8b8b8b"

[colors.tab_bar.new_tab]
bg_color = "#383a3d"
fg_color = "#5e6063"

[colors.tab_bar.new_tab_hover]
bg_color = "#2c2e31"
fg_color = "#b4b1ad"
