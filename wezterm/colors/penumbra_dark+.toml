# Penumbra v2 -- WezTerm Color Scheme
# Theme: penumbra_dark+
# Mode: dark, Tier: contrast_plus

[metadata]
name = "Penumbra Dark+"
author = "Neal McKee"

[colors]
foreground = "#999999"
background = "#1d2024"
cursor_bg = "#efe8dd"
cursor_border = "#efe8dd"
cursor_fg = "#1d2024"
selection_bg = "#292b30"
selection_fg = "#999999"

ansi = [
  "#131418",
  "#cd6584",
  "#81a026",
  "#c68237",
  "#008ccd",
  "#917bbf",
  "#009989",
  "#efe8dd",
]

brights = [
  "#5b5d62",
  "#cd6584",
  "#81a026",
  "#c68237",
  "#008ccd",
  "#917bbf",
  "#009989",
  "#fff6e9",
]

[colors.tab_bar]
background = "#292b30"

[colors.tab_bar.active_tab]
bg_color = "#1d2024"
fg_color = "#bab8b4"

[colors.tab_bar.inactive_tab]
bg_color = "#292b30"
fg_color = "#5b5d62"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#1d2024"
fg_color = "#999999"

[colors.tab_bar.new_tab]
bg_color = "#292b30"
fg_color = "#5b5d62"

[colors.tab_bar.new_tab_hover]
bg_color = "#1d2024"
fg_color = "#bab8b4"
